<!DOCTYPE html>
<html>
<head>
    <title>Scan Ticket</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            background: black;
            color: white;
            text-align: center;
            font-family: Arial;
        }
        #reader {
            width: 300px;
            margin: auto;
        }
        h1 {
            margin-top: 20px;
        }

    .scanner-event-info {
        margin: 18px auto;
        padding: 16px;
        max-width: 360px;
        border: 1px solid #f5c542;
        border-radius: 10px;
        background: #171717;
    }

    .scanner-event-info p {
        margin: 0 0 8px;
        color: #ccc;
        font-size: 15px;
    }

    .scanner-event-info h2 {
        margin: 0;
        color: #f5c542;
        font-size: 22px;
    }

    .scanner-navigation {
        margin: 18px auto 24px;
    }

    .scanner-navigation a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 8px;
        background: #f5c542;
        color: #111;
        text-decoration: none;
        font-weight: bold;
    }

</style>
</head>
<body>

<h1>Scan Ticket</h1>

<div class="scanner-event-info">
  {% if selected_event %}
    <p>Currently Checking In:</p>
    <h2>{{ selected_event }}</h2>
  {% else %}
    <p>Scanning Tickets — All Events</p>
  {% endif %}
</div>

<div class="scanner-navigation">
  <a href="{{ url_for('checkin_page') }}">
    {{ 'Change Event' if role == 'door' else 'Guest List / Change Event' }}
  </a>
</div>

<div id="reader"></div>

<script>
function onScanSuccess(decodedText, decodedResult) {
    console.log(`Code matched = ${decodedText}`);

    // Extract ticket ID (last part of URL or raw code)
    let ticketId = decodedText;

    if (decodedText.includes("/checkin/")) {
        ticketId = decodedText.split("/checkin/")[1];
    }

    window.location.href = "/checkin/" + ticketId;
}

let html5QrcodeScanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, qrbox: 250 }
);

html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
